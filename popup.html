<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NeoBypass</title>
    <style>
        body {
            background-color: #c0c0c0;
            color: black;
            font-family: 'MS Sans Serif', Tahoma, sans-serif;
            width: 380px;
            margin: 0;
            padding: 8px;
            box-sizing: border-box;
            border-top: 2px solid #ffffff;
            border-left: 2px solid #ffffff;
            border-right: 2px solid #808080;
            border-bottom: 2px solid #808080;
        }

        .title-bar {
            background: linear-gradient(to right, #000080, #1084d0);
            color: white;
            padding: 2px 4px;
            font-weight: bold;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 14px;
            margin-bottom: 8px;
        }

        .title-bar-text {
            display: flex;
            align-items: center;
        }

        .title-bar-controls button {
            background-color: #c0c0c0;
            border-top: 1px solid #ffffff;
            border-left: 1px solid #ffffff;
            border-right: 1px solid #000000;
            border-bottom: 1px solid #000000;
            font-weight: bold;
            font-size: 10px;
            width: 16px;
            height: 14px;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 0;
            cursor: default;
        }

        .title-bar-controls button:active {
            border-top: 1px solid #000000;
            border-left: 1px solid #000000;
            border-right: 1px solid #ffffff;
            border-bottom: 1px solid #ffffff;
        }

        .made-by {
            text-align: center;
            font-size: 12px;
            margin-bottom: 12px;
        }

        .made-by a {
            color: #0000ff;
        }

        .fieldset {
            border-top: 1px solid #808080;
            border-left: 1px solid #808080;
            border-right: 1px solid #ffffff;
            border-bottom: 1px solid #ffffff;
            padding: 10px;
            margin-bottom: 12px;
            position: relative;
        }

        .legend {
            background-color: #c0c0c0;
            position: absolute;
            top: -8px;
            left: 8px;
            padding: 0 4px;
            font-size: 12px;
        }

        .listbox {
            background-color: #ffffff;
            border-top: 2px solid #808080;
            border-left: 2px solid #808080;
            border-right: 2px solid #ffffff;
            border-bottom: 2px solid #ffffff;
            padding: 4px;
            font-size: 12px;
            max-height: 250px;
            overflow-y: auto;
            margin-top: 8px;
        }

        .shortcut-item {
            display: flex;
            justify-content: space-between;
            padding: 4px 2px;
            border-bottom: 1px dotted #c0c0c0;
        }
        
        .shortcut-item:last-child {
            border-bottom: none;
        }

        .shortcut-key {
            font-weight: bold;
        }

        .shortcut-group {
            font-weight: bold;
            background-color: #000080;
            color: white;
            padding: 2px;
            margin-top: 6px;
        }

        .shortcut-group:first-child {
            margin-top: 0;
        }

        .button {
            background-color: #c0c0c0;
            border-top: 2px solid #ffffff;
            border-left: 2px solid #ffffff;
            border-right: 2px solid #808080;
            border-bottom: 2px solid #808080;
            padding: 4px 8px;
            font-family: inherit;
            font-size: 12px;
            cursor: pointer;
            width: 100%;
            margin-bottom: 8px;
        }

        .button:active {
            border-top: 2px solid #808080;
            border-left: 2px solid #808080;
            border-right: 2px solid #ffffff;
            border-bottom: 2px solid #ffffff;
            padding: 5px 7px 3px 9px;
        }

        .flex-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
            font-size: 12px;
        }

        #error {
            color: red;
            text-align: center;
            font-size: 12px;
            display: none;
            margin-top: 4px;
        }

        .input-field {
            width: 100%;
            padding: 4px;
            margin-bottom: 8px;
            box-sizing: border-box;
            border: 1px solid #808080;
            font-family: inherit;
            font-size: 12px;
        }

        .input-label {
            display: block;
            margin-bottom: 2px;
            font-size: 12px;
        }

        #successMessage {
            color: green;
            text-align: center;
            font-size: 12px;
            display: none;
            margin-top: 4px;
        }
    </style>
</head>
<body>
    <div class="title-bar">
        <div class="title-bar-text">NeoBypass</div>
        <div class="title-bar-controls">
            <button id="closeButton" aria-label="Close">x</button>
        </div>
    </div>
    
    <div class="made-by">
        Made by <a href="https://github.com/Arka-Sengupta" target="_blank">Arka Sengupta</a>
    </div>

    <div class="fieldset">
        <div class="legend">Shortcuts</div>
        <div class="listbox">
            <div class="shortcut-group">Examly / Iamneo</div>
            <div class="shortcut-item">
                <span>Type Coding Answers</span>
                <span class="shortcut-key">Alt+Shift+Y</span>
            </div>
            <!-- <div class="shortcut-item">
                <span>Search Answers (AI)</span>
                <span class="shortcut-key">Opt+Shift+A</span>
            </div> -->

            <!-- <div class="shortcut-group">Universal</div>

            <div class="shortcut-item">

            <div class="shortcut-item">

                <span>Solve NPTEL</span>

        </div>
    </div>

    <div class="fieldset">
        <div class="legend">Gemini Configuration</div>
        <label class="input-label" for="geminiApiKey">Gemini API Key (starts with AQ.)</label>
        <input type="password" id="geminiApiKey" class="input-field" placeholder="Enter Gemini API Key">
        
        <label class="input-label" for="geminiModelName">Model Name</label>
        <input type="text" id="geminiModelName" class="input-field" placeholder="e.g. gemini-2.5-flash">
        
        <button id="saveConfigButton" class="button" style="margin-bottom: 0;">Save Configuration</button>
        <div id="successMessage">Saved successfully!</div>
    </div>

    <div class="fieldset">
        <div class="legend">Settings</div>
        <div class="flex-row">
            <span>Toast Opacity (Opt+O)</span>
            <button id="toastOpacityToggle" class="button" style="width: 80px; margin: 0;">
                <span id="opacityLevel">High</span>
            </button>
        </div>
    </div>

    <button id="uninstallButton" class="button">Uninstall Extension</button>
    <div id="error"></div>
    
    <script src="popup.js"></script>
</body>
</html>
